name: Issue Opened

on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  opened:
    runs-on: ubuntu-latest

    steps:
      - name: Add 🕐 等待
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.issue;

            // 添加标签
            await github.rest.issues.addLabels({
              owner: issue.owner,
              repo: issue.repo,
              issue_number: issue.number,
              labels: [
                "🕐 等待"
              ]
            });
